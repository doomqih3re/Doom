      <stop offset="60%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#05050b"/>
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
